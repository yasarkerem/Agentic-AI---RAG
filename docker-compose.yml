# Local development stack.
#   docker compose run --rm app            -> `arb info` inside the image
#   docker compose up qdrant               -> vector store for Phase 2+
services:
  app:
    build: .
    image: agentic-rag-bench:dev
    environment:
      ARB_LOG_FORMAT: json
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  qdrant-storage:

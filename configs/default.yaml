# Shared defaults for every system under test.
# Fairness controls (brief §2): corpus, embedding model, vector store,
# reranker, and generation model are identical across systems; only the
# pipeline shape differs. System files overlay this one.

name: default
system_type: standard_rag
seed: 42

chunking:
  chunk_size: 512
  chunk_overlap: 64

embedding:
  provider: mock            # 'mock' keeps tests free of API calls; swap per experiment
  model: mock-embedder

retrieval:
  top_k: 8
  use_bm25: false
  dense_weight: 1.0         # must be 1.0 while use_bm25 is false

reranker:
  enabled: false
  model: mock-reranker
  top_n: 5

generation:
  provider: mock
  model: mock-llm
  temperature: 0.0
  max_output_tokens: 2048
  context_token_limit: 8192

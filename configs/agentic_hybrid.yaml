# System B variant — Agentic RAG with hybrid (dense + BM25) retrieval.
# Overlays configs/default.yaml.

name: agentic-rag-hybrid
system_type: agentic_rag

retrieval:
  top_k: 8
  use_bm25: true
  dense_weight: 0.5

agent:
  max_retrieval_rounds: 3
  max_subquestions: 6
  max_total_tokens: 100000
  max_cost_usd: 1.0
  max_retries: 2
  timeout_seconds: 300.0

[project]
name = "agentic-rag-bench"
version = "0.1.0"
description = "A reproducible benchmark comparing standard RAG with an agentic retrieval pipeline on complex research tasks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kerem Yasar" }]
keywords = ["rag", "agentic-rag", "retrieval", "benchmark", "evaluation", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.1,<7",
    "structlog>=24.4,<26",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.16,<1",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
arb = "agentic_rag_bench.cli:main"

[project.urls]
Repository = "https://github.com/yasarkerem/mcp"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401", # dynamically-typed *args/**kwargs are fine at boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Tests keep full strict checking except mandatory annotations on every
# test function — pytest fixtures make that noise, not safety.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that wire multiple components together",
]

[tool.coverage.run]
source = ["src/agentic_rag_bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
